services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trailblaze_ledger
      POSTGRES_USER: trailblaze
      POSTGRES_PASSWORD: trailblaze_dev_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trailblaze -d trailblaze_ledger"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
