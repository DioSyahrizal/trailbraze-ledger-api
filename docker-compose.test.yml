services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trailblaze_ledger_test
      POSTGRES_USER: trailblaze
      POSTGRES_PASSWORD: trailblaze_dev_password
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trailblaze -d trailblaze_ledger_test"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_test_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres_test_data:
  redis_test_data:
